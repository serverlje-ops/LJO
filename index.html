<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nachtkontrolle</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16213a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nachtkontrolle">
<style>
  :root{
    --bg: #16213a;
    --bg-soft: #1e2e4d;
    --card: #223559;
    --ink: #f3efe6;
    --ink-dim: #b9c2d6;
    --lantern: #e8a94c;
    --lantern-dim: #7a5c2e;
    --ok: #6fa384;
    --warn: #d9704f;
    --line: #2c3e63;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 600px at 50% -100px, #1c2c4c 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding-bottom: 60px;
    min-height:100vh;
  }
  header{
    position: sticky; top:0; z-index:20;
    background: linear-gradient(180deg, #16213a 80%, rgba(22,33,58,0));
    padding: 14px 16px 8px;
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h1{
    font-size: 1.15rem; margin:0; letter-spacing:.02em;
    font-weight:700; display:flex; align-items:center; gap:8px;
  }
  h1 .lantern-dot{
    width:10px;height:10px;border-radius:50%;
    background: var(--lantern);
    box-shadow: 0 0 10px 3px rgba(232,169,76,.55);
    display:inline-block;
  }
  .progress-wrap{margin-top:10px;}
  .progress-bar{
    height:8px; border-radius:6px; background: var(--bg-soft); overflow:hidden;
  }
  .progress-fill{
    height:100%; background: linear-gradient(90deg, var(--lantern-dim), var(--lantern));
    transition: width .3s ease;
    width:0%;
  }
  .progress-label{font-size:.75rem; color:var(--ink-dim); margin-top:4px; display:flex; justify-content:space-between;}

  #storageNotice{
    margin: 10px 16px 0; font-size:.72rem; color: var(--ink-dim);
    background: var(--bg-soft); border-radius: 10px; padding: 8px 12px;
    display:none; border:1px solid var(--line);
  }
  #storageNotice.show{display:block;}

  .controls{
    display:flex; gap:8px; padding: 12px 16px 4px; flex-wrap:wrap;
  }
  input[type="search"], input[type="text"], input[type="number"]{
    background: var(--card); border:1px solid var(--line); color:var(--ink);
    padding:9px 12px; border-radius:10px; font-size:.9rem;
  }
  input::placeholder{color: var(--ink-dim);}
  .controls input[type="search"]{flex:1; min-width:140px;}
  .filter-btn{
    background: var(--card); border:1px solid var(--line); color:var(--ink-dim);
    padding:9px 12px; border-radius:10px; font-size:.8rem; white-space:nowrap;
  }
  .filter-btn.active{ background: var(--lantern-dim); color:#fff1dd; border-color:var(--lantern);}

  .add-toggle-row{ padding: 4px 16px 4px; }
  .add-toggle-row button{
    width:100%; background: var(--card); border:1px dashed var(--line); color: var(--lantern);
    padding:10px; border-radius:10px; font-size:.85rem; font-weight:600;
  }
  #addPanel{
    display:none; margin: 8px 16px 0; background: var(--card); border:1px solid var(--line);
    border-radius: var(--radius); padding: 12px;
  }
  #addPanel.show{display:block;}
  #addPanel .add-row{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  #addPanel input{ flex:1; min-width:90px; }
  #addPanel button.submit{
    width:100%; background: var(--lantern); color:#2a1c0d; border:none; font-weight:700;
    padding:10px; border-radius:10px; font-size:.85rem;
  }

  main{padding: 6px 16px 20px;}
  #loadingHint{ text-align:center; color: var(--ink-dim); padding: 30px 10px; font-size:.85rem; }

  .floor-heading{
    margin: 18px 0 8px; font-size:.75rem; letter-spacing:.12em; text-transform:uppercase;
    color: var(--ink-dim); display:flex; align-items:center; gap:8px;
  }
  .floor-heading::after{content:""; flex:1; height:1px; background: var(--line);}

  .room-card{
    background: var(--card); border:1px solid var(--line); border-radius: var(--radius);
    margin-bottom:10px; overflow:hidden;
  }
  .room-head{
    padding: 8px 14px; font-size:.78rem; color: var(--ink-dim);
    display:flex; justify-content:space-between; background: rgba(255,255,255,.02);
  }
  .room-head b{color:var(--ink); font-size:.85rem;}
  .person-row{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-top:1px solid var(--line);
  }
  .chk{
    width:26px;height:26px; border-radius:50%; border:2px solid var(--ink-dim);
    flex:none; display:flex; align-items:center; justify-content:center;
    font-size:.9rem; color:transparent; background:transparent;
    -webkit-tap-highlight-color: transparent;
  }
  .chk.checked{ background: var(--ok); border-color:var(--ok); color:#0e2019;}
  .person-info{flex:1; min-width:0;}
  .p-name{font-size:.92rem; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .p-name .icon-btn{opacity:.55; font-size:.85rem; cursor:pointer; padding:2px;}
  .badge{
    font-size:.68rem; padding:2px 7px; border-radius:20px; border:1px solid var(--line);
    color: var(--ink-dim);
  }
  .badge.minor{ color:#2c1c14; background: var(--lantern); border-color:var(--lantern); font-weight:600;}

  .edit-row{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .edit-row input.name{flex:2; min-width:100px;}
  .edit-row input.age{flex:1; min-width:60px;}
  .edit-row input.room{flex:1; min-width:60px;}
  .edit-row button{
    border:none; border-radius:8px; padding:6px 10px; font-size:.78rem;
  }
  .edit-row button.save{ background: var(--lantern-dim); color:#fff1dd; }
  .edit-row button.delete{ background: var(--warn); color:#2a1410; }

  .footer-actions{
    display:flex; gap:10px; padding: 14px 16px 30px; flex-wrap:wrap;
  }
  .footer-actions button{
    flex:1; min-width:140px;
    background: var(--lantern); color:#2a1c0d; border:none; font-weight:600;
    padding:11px 14px; border-radius:10px; font-size:.82rem;
  }
  .empty-state{ text-align:center; color:var(--ink-dim); padding:30px 10px; font-size:.85rem;}
</style>
</head>
<body>

<noscript>
  <div style="margin:16px; padding:12px; background:#3a2333; border:1px solid #d9704f; border-radius:10px; font-size:.85rem;">
    JavaScript ist deaktiviert – diese App braucht aktiviertes JavaScript, um die Personenliste vom Server zu laden.
  </div>
</noscript>

<header>
  <div class="title-row">
    <h1><span class="lantern-dot"></span> Nachtkontrolle</h1>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressLabel">0 / 0 abgemeldet</span></div>
  </div>
</header>

<div id="storageNotice"></div>

<div class="controls">
  <input type="search" id="search" placeholder="Name oder Zimmer suchen…">
  <button class="filter-btn" id="filterOpen">Nur offene</button>
  <button class="filter-btn" id="filterU16">Nur U16</button>
  <button class="filter-btn" id="filterU18">Nur U18</button>
</div>

<div class="add-toggle-row">
  <button id="addToggleBtn">+ Person hinzufügen</button>
</div>
<div id="addPanel">
  <div class="add-row">
    <input type="text" id="addName" placeholder="Name">
    <input type="number" id="addAge" placeholder="Alter">
    <input type="text" id="addRoom" placeholder="Zimmer (z.B. 202)">
  </div>
  <button class="submit" id="addSubmitBtn">Hinzufügen</button>
</div>

<main id="main">
  <div id="loadingHint">Lade Personenliste vom Server…</div>
</main>

<div class="empty-state" id="emptyState" style="display:none;">Keine Treffer für diese Auswahl.</div>

<div class="footer-actions">
  <button id="resetBtn">Heutige Nacht zurücksetzen</button>
  <button id="deleteAllBtn" style="background:var(--warn); color:#2a1410;">Alle Namen &amp; Infos löschen</button>
</div>

<script>
(function(){
  const AGE_LIMIT = 16;
  const main = document.getElementById('main');

  let roster = [];       // [{id,name,age,room}]
  let memNight = {};      // {personId: true}
  let filters = { open: false, u16: false, u18: false }; // mehrere gleichzeitig aktivierbar
  let searchTerm = '';
  let serverReachable = true;
  let openEditId = null;  // welches Formular gerade offen ist, damit es beim Neuzeichnen offen bleibt

  async function loadState(){
    try{
      const res = await fetch('/api/state');
      const data = await res.json();
      memNight = data.night || {};
      roster = data.roster || [];
      serverReachable = true;
    }catch(e){
      serverReachable = false;
    }
  }
  async function saveNight(){
    try{
      await fetch('/api/night', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ night: memNight })
      });
      serverReachable = true;
    }catch(e){ serverReachable = false; }
  }
  async function addPerson(name, age, room){
    const res = await fetch('/api/person', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name, age, room })
    });
    return res.json();
  }
  async function updatePerson(id, fields){
    const res = await fetch('/api/person/' + encodeURIComponent(id), {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(fields)
    });
    return res.json();
  }
  async function deletePerson(id){
    const res = await fetch('/api/person/' + encodeURIComponent(id), { method: 'DELETE' });
    return res.json();
  }

  function floorOf(room){
    const n = parseInt(String(room)[0], 10);
    return isNaN(n) ? 0 : n;
  }
  function floorLabel(f){
    if (f === 0) return 'Sonstige Zimmer';
    return 'Etage ' + f;
  }

  function escapeHtml(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function personRowHtml(p){
    const isMinor = p.age !== null && p.age !== undefined && p.age < AGE_LIMIT;
    const checked = !!memNight[p.id];
    const badge = (p.age !== null && p.age !== undefined)
      ? `<span class="badge ${isMinor ? 'minor' : ''}">${p.age} J.</span>`
      : `<span class="badge">Alter?</span>`;
    const editOpen = openEditId === p.id;
    return `
      <div class="person-row" data-id="${p.id}">
        <button class="chk ${checked?'checked':''}" data-action="toggle" data-id="${p.id}">${checked?'✓':''}</button>
        <div class="person-info">
          <div class="p-name">
            <span class="p-name-text">${escapeHtml(p.name)}</span>
            ${badge}
            <span class="icon-btn" data-action="edit" data-id="${p.id}">✎</span>
          </div>
          <div class="edit-form" data-form="${p.id}" style="display:${editOpen ? 'block' : 'none'};">
            <div class="edit-row">
              <input class="name" type="text" value="${escapeHtml(p.name)}" placeholder="Name">
              <input class="age" type="number" value="${p.age ?? ''}" placeholder="Alter">
              <input class="room" type="text" value="${escapeHtml(p.room)}" placeholder="Zimmer">
            </div>
            <div class="edit-row">
              <button class="save" data-action="save-edit" data-id="${p.id}">Speichern</button>
              <button class="delete" data-action="delete" data-id="${p.id}">Entfernen</button>
            </div>
          </div>
        </div>
      </div>`;
  }

  function matchesFilters(p){
    const name = p.name.toLowerCase();
    const room = String(p.room).toLowerCase();
    const matchesSearch = !searchTerm || name.includes(searchTerm) || room.includes(searchTerm);
    const checked = !!memNight[p.id];
    const hasAge = p.age !== null && p.age !== undefined;

    if(filters.open && checked) return false;
    if(filters.u16 && !(hasAge && p.age < 16)) return false;
    if(filters.u18 && !(hasAge && p.age < 18)) return false;

    return matchesSearch;
  }

  function render(){
    const visiblePeople = roster.filter(matchesFilters);
    const visibleIds = new Set(visiblePeople.map(p => p.id));

    const rooms = {};
    roster.forEach(p => { (rooms[p.room] = rooms[p.room] || []).push(p); });

    const floors = {};
    Object.keys(rooms).forEach(room => {
      const f = floorOf(room);
      (floors[f] = floors[f] || []).push(room);
    });
    Object.values(floors).forEach(list => list.sort((a,b)=> a.localeCompare(b, undefined, {numeric:true})));
    const floorKeys = Object.keys(floors).map(Number).sort((a,b)=>a-b);

    let html = '';
    let anyVisible = false;

    floorKeys.forEach(f => {
      let floorHtml = '';
      let floorHasVisible = false;
      floors[f].forEach(room => {
        const people = rooms[room].filter(p => visibleIds.has(p.id));
        if(people.length === 0) return;
        floorHasVisible = true; anyVisible = true;
        floorHtml += `
          <div class="room-card">
            <div class="room-head"><b>Zimmer ${escapeHtml(room)}</b><span>${rooms[room].length} Person(en)</span></div>
            ${people.map(personRowHtml).join('')}
          </div>`;
      });
      if(floorHasVisible){
        html += `<div class="floor-heading">${floorLabel(f)}</div>${floorHtml}`;
      }
    });

    main.innerHTML = html;
    document.getElementById('emptyState').style.display = anyVisible ? 'none' : 'block';

    const total = roster.length;
    const checkedCount = roster.filter(p => memNight[p.id]).length;
    document.getElementById('progressFill').style.width = total ? (100*checkedCount/total)+'%' : '0%';
    document.getElementById('progressLabel').textContent = `${checkedCount} / ${total} abgemeldet`;
  }

  main.addEventListener('click', async (e)=>{
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if(action==='toggle'){
      memNight[id] = !memNight[id];
      render();
      await saveNight();
    }
    if(action==='edit'){
      openEditId = (openEditId === id) ? null : id;
      render();
    }
    if(action==='save-edit'){
      const row = main.querySelector(`.person-row[data-id="${id}"]`);
      const name = row.querySelector('.edit-row .name').value.trim();
      const ageVal = row.querySelector('.edit-row .age').value.trim();
      const roomVal = row.querySelector('.edit-row .room').value.trim();
      const age = ageVal === '' ? null : Number(ageVal);
      const { person } = await updatePerson(id, { name, age, room: roomVal });
      if(person){
        const idx = roster.findIndex(p => p.id === id);
        if(idx > -1) roster[idx] = person;
      }
      openEditId = null;
      render();
    }
    if(action==='delete'){
      if(!confirm('Diese Person wirklich aus der Liste entfernen?')) return;
      await deletePerson(id);
      roster = roster.filter(p => p.id !== id);
      delete memNight[id];
      openEditId = null;
      render();
    }
  });

  document.getElementById('search').addEventListener('input', (e)=>{
    searchTerm = e.target.value.toLowerCase().trim();
    render();
  });

  const filterButtons = {
    open: document.getElementById('filterOpen'),
    u16: document.getElementById('filterU16'),
    u18: document.getElementById('filterU18'),
  };
  function toggleFilter(key){
    filters[key] = !filters[key];
    filterButtons[key].classList.toggle('active', filters[key]);
    render();
  }
  filterButtons.open.addEventListener('click', ()=> toggleFilter('open'));
  filterButtons.u16.addEventListener('click', ()=> toggleFilter('u16'));
  filterButtons.u18.addEventListener('click', ()=> toggleFilter('u18'));

  const addPanel = document.getElementById('addPanel');
  document.getElementById('addToggleBtn').addEventListener('click', ()=>{
    addPanel.classList.toggle('show');
  });
  document.getElementById('addSubmitBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('addName').value.trim();
    const ageVal = document.getElementById('addAge').value.trim();
    const room = document.getElementById('addRoom').value.trim();
    if(!name || !room){
      alert('Bitte mindestens Name und Zimmer eingeben.');
      return;
    }
    const age = ageVal === '' ? null : Number(ageVal);
    const { person } = await addPerson(name, age, room);
    if(person) roster.push(person);
    document.getElementById('addName').value = '';
    document.getElementById('addAge').value = '';
    document.getElementById('addRoom').value = '';
    addPanel.classList.remove('show');
    render();
  });

  document.getElementById('resetBtn').addEventListener('click', async ()=>{
    const input = prompt('Um alle Häkchen für die heutige Nacht zurückzusetzen, bitte das Wort "löschen" eingeben:');
    if(input === null) return;
    if(input.trim().toLowerCase() !== 'löschen'){
      alert('Falsches Wort eingegeben – es wurde nichts zurückgesetzt.');
      return;
    }
    memNight = {};
    render();
    await saveNight();
  });

  document.getElementById('deleteAllBtn').addEventListener('click', async ()=>{
    const input = prompt('ACHTUNG: Das löscht ALLE Namen, Zimmer und Häkchen unwiderruflich. Zum Bestätigen bitte genau "Alle Benutzer löschen" eingeben:');
    if(input === null) return;
    if(input.trim().toLowerCase() !== 'alle benutzer löschen'){
      alert('Falscher Text eingegeben – es wurde nichts gelöscht.');
      return;
    }
    try{
      await fetch('/api/roster', { method: 'DELETE' });
    }catch(e){}
    roster = [];
    memNight = {};
    openEditId = null;
    render();
  });

  async function refreshFromServer(){
    await loadState();
    const notice = document.getElementById('storageNotice');
    notice.classList.add('show');
    notice.textContent = serverReachable
      ? 'Verbunden – Personenliste und Häkchen werden mit dem Server synchronisiert, alle Geräte sehen denselben Stand.'
      : 'Kein Server erreichbar gerade – bitte Internetverbindung prüfen.';
    render();
  }

  (async function init(){
    await refreshFromServer();
    setInterval(refreshFromServer, 6000);
  })();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
